server {
    listen 80;
    server_name payroll.3putraperkasa.com;
    root /alurelab/repositories/solution/public;
    index index.php;

    client_max_body_size 10M;

    # iClock ADMS protocol endpoints (fingerprint machines)
    location /iclock {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /cdata {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /getrequest {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API endpoints
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Dashboard / attendance monitoring
    location /attendance {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel default routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/payroll.3putraperkasa.com.access.log;
    error_log  /var/log/nginx/payroll.3putraperkasa.com.error.log;
}
